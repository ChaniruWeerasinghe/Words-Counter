<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogLogoGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4338CA" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- Subtle Minimalist Accent Grid -->
  <g opacity="0.04" stroke="#111827" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Centered Brand Content -->
  <g transform="translate(600, 315)">
    <!-- Centered Verba Logo Mark (Scalable) -->
    <g transform="translate(-50, -170)" filter="url(#subtleShadow)">
      <svg width="100" height="100" viewBox="0 0 32 32" fill="none">
        <path d="M4 7L16 27L28 7" stroke="url(#ogLogoGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 12L16 22L22 12" stroke="url(#ogLogoGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        <circle cx="16" cy="6" r="2.2" fill="url(#ogLogoGrad)"/>
      </svg>
    </g>

    <!-- Main Title -->
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#111827" letter-spacing="-1.5">
      Verba
    </text>

    <!-- Subtitle Badge -->
    <g transform="translate(0, 35)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#4B5563" letter-spacing="1.2">
        ACADEMIC COURSEWORK SUITE
      </text>
    </g>

    <!-- Tagline Description -->
    <text x="0" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#6B7280" letter-spacing="-0.2">
      Precision Coursework Word Counter &amp; Heading-by-Heading Report Analyzer
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 160)">
      <rect x="-310" y="-16" width="180" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="-220" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4338CA">
        ±10% Tolerance Check
      </text>

      <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#FDF4FF" stroke="#F5D0FE" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7E22CE">
        DOCX &amp; PDF Heading Parser
      </text>

      <rect x="130" y="-16" width="180" height="32" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      <text x="220" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#15803D">
        100% Client-side Privacy
      </text>
    </g>
  </g>
</svg>
